[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "konr"
version = "0.1.0"
description = "Hierarchical multi-agent AI penetration testing system"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75.0",
    "textual>=0.47.0",
    "chromadb>=0.5.0",
    "docker>=7.0.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "shodan>=1.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
konr = "konr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["konr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Specialist system prompts contain embedded shell commands and URLs that cannot be line-wrapped
"konr/agents/specialists/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live tests requiring ANTHROPIC_API_KEY + Docker + konr:latest",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
